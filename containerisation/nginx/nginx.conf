worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream – Flask backend (service name from docker-compose)
    upstream backend {
        server backend:5000;
    }

    # Docker's internal DNS — resolves container names at request time
    # (prevents nginx failing to start when DD containers aren't up yet)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name metarobolearn.duckdns.org;

        # Let's Encrypt webroot challenge - serve directly via HTTP (don't redirect)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name metarobolearn.duckdns.org;
        http2 on;

        # ── SSL CERTIFICATES ──────────────────────────────────────────────────
        # Let's Encrypt certificates (DuckDNS)
        ssl_certificate     /etc/letsencrypt/live/metarobolearn.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/metarobolearn.duckdns.org/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # ── Frontend (SPA – React) ───────────────────────────────────────────
        root  /usr/share/nginx/html;
        index index.html;

        # Let's Encrypt webroot challenge - MUST come before location /
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Models config – never cache so new models are picked up immediately
        location = /models/models.json {
            add_header Cache-Control "no-store";
        }

        # ── Static files (badge images) ──────────────────────────────────────
        location /static/uploads/badges/ {
            alias /usr/share/nginx/static/uploads/badges/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── REST API proxy ───────────────────────────────────────────────────
        location /api {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # ── WebSocket proxy (Flask-Sock / broker) ────────────────────────────
        location /api/broker/robots {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     86400;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # DeceptionDetector — deception-detector.duckdns.org
    # ═══════════════════════════════════════════════════════════════════════════

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name deception-detector.duckdns.org;

        # Let's Encrypt webroot challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name deception-detector.duckdns.org;
        http2 on;

        ssl_certificate     /etc/letsencrypt/live/deception-detector.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deception-detector.duckdns.org/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        client_max_body_size 50M;

        # ── Let's Encrypt renewal challenge ───────────────────────────────────
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # ── Backend API – large file downloads (must be before /api/) ─────────
        location /api/custom/download/ {
            set $dd_backend "deception-detector-backend";
            proxy_pass         http://$dd_backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_request_buffering off;
            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
            proxy_max_temp_file_size 0;
        }

        # ── Backend API ────────────────────────────────────────────────────────
        location /api/ {
            set $dd_backend "deception-detector-backend";
            proxy_pass         http://$dd_backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_buffering on;
            proxy_request_buffering off;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ── Frontend (Vue SPA) ─────────────────────────────────────────────────
        location / {
            set $dd_frontend "deception-detector-frontend";
            proxy_pass         http://$dd_frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
