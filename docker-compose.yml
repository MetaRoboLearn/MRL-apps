# ─────────────────────────────────────────────────────────────────────────────
# DEVELOPMENT ONLY  –  no HTTPS, no nginx, hot-reload friendly
# For the full production stack (nginx + HTTPS + PostgreSQL) use:
#   docker compose -f containerisation/docker-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────
services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - default

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file: containerisation/.env
    # DATABASE_URL comes from containerisation/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - ./server/static/uploads/badges:/app/static/uploads/badges
      - ./server/static/stickers:/app/static/stickers
    command: python app.py
    extra_hosts:
      - "host.docker.internal:host-gateway" #added for the purpose of local dev (so that the container can connect to external postgres instance running on the same PC)
    depends_on:
      - redis
    networks:
      - default
      

  frontend:
    build:
      context: ./gui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./gui/public/models:/app/public/models
    
    networks:
      - default


